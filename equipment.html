
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Equipment Inventory</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: 'Inter', sans-serif;
    padding: 30px;
}

/* BACK BUTTON */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #e5e7eb;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 24px;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    transition: background 0.15s;
}

.back-btn:hover {
    background: #222;
}

.back-btn svg {
    width: 16px;
    height: 16px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 24px;
    font-weight: 600;
}

.subtitle {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 5px;
}

/* ADD BUTTON */
.add-btn {
    background: #3b82f6;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.add-btn:hover {
    background: #2563eb;
}

/* CARD */
.card {
    margin-top: 25px;
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    overflow: hidden;
}

/* CARD HEADER */
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid #2a2a2a;
}

.card-title {
    font-size: 16px;
    font-weight: 500;
}

/* SEARCH */
.search {
    background: #111;
    border: 1px solid #2a2a2a;
    padding: 8px 14px;
    border-radius: 8px;
    color: white;
    width: 220px;
}

.search::placeholder {
    color: #6b7280;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    text-align: left;
    padding: 14px 20px;
    font-size: 12px;
    color: #9ca3af;
    background: #111;
    letter-spacing: 0.05em;
}

td {
    padding: 18px 20px;
    border-top: 1px solid #2a2a2a;
}

/* ALIGNMENTS */
td:nth-child(4) {
    text-align: center;
}

/* BADGE */
.badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: inline-block;
}

.badge.good {
    background: rgba(34,197,94,0.15);
    color: #22c55e;
}

.badge.average {
    background: rgba(234,179,8,0.15);
    color: #eab308;
}

.badge.bad {
    background: rgba(239,68,68,0.15);
    color: #ef4444;
}

/* ACTION BUTTONS */
.action-btn {
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
}

.edit {
    background: #1f2937;
    color: white;
}

.edit:hover {
    background: #374151;
}

.delete {
    background: #ef4444;
    color: white;
}

.delete:hover {
    background: #dc2626;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 30px;
    width: 90%;
    max-width: 400px;
}

.modal-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 6px;
    font-weight: 500;
}

.form-group input,
.form-group select {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    color: white;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3b82f6;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
}

.btn-save {
    flex: 1;
    background: #3b82f6;
    border: none;
    color: white;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
}

.btn-save:hover {
    background: #2563eb;
}

.btn-cancel {
    flex: 1;
    background: #374151;
    border: none;
    color: white;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
}

.btn-cancel:hover {
    background: #4b5563;
}

.empty-message {
    text-align: center;
    padding: 40px 20px;
    color: #9ca3af;
}
</style>

</head>

<body>

<!-- BACK BUTTON -->
<button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back to Dashboard
</button>

<!-- HEADER -->
<div class="header">
    <div>
        <div class="title">Equipment Inventory</div>
        <div class="subtitle">Manage gym equipment</div>
    </div>

    <button class="add-btn" id="addBtn">+ Add Equipment</button>
</div>

<!-- CARD -->
<div class="card">

    <div class="card-header">
        <div class="card-title">Equipment List</div>
        <input class="search" id="searchInput" placeholder="Search equipment...">
    </div>

    <table>
        <thead>
            <tr>
                <th>EQUIPMENT NAME</th>
                <th>TYPE</th>
                <th>CONDITION</th>
                <th>QUANTITY</th>
                <th>ACTIONS</th>
            </tr>
        </thead>

        <tbody id="tableBody">
            <tr>
                <td colspan="5" class="empty-message">Loading equipment...</td>
            </tr>
        </tbody>
    </table>

</div>

<!-- MODAL -->
<div class="modal" id="equipmentModal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">Add Equipment</div>
        
        <form id="equipmentForm">
            <div class="form-group">
                <label for="equipmentName">Equipment Name</label>
                <input type="text" id="equipmentName" required>
            </div>

            <div class="form-group">
                <label for="equipmentType">Type</label>
                <input type="text" id="equipmentType" required>
            </div>

            <div class="form-group">
                <label for="equipmentCondition">Condition</label>
                <select id="equipmentCondition" required>
                    <option value="">Select condition</option>
                    <option value="GOOD">GOOD</option>
                    <option value="AVERAGE">AVERAGE</option>
                    <option value="BAD">BAD</option>
                </select>
            </div>

            <div class="form-group">
                <label for="equipmentQuantity">Quantity</label>
                <input type="number" id="equipmentQuantity" min="1" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Save</button>
                <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBawDWPi-NvWl3bKyGVIFi-v9FX7yHraEI",
    authDomain: "gimbo-dc910.firebaseapp.com",
    projectId: "gimbo-dc910",
    storageBucket: "gimbo-dc910.firebasestorage.app",
    messagingSenderId: "294864961933",
    appId: "1:294864961933:web:61d6c4086c09a506bf3dc4",
    measurementId: "G-XSBFDNVXKD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DOM Elements
const modal = document.getElementById('equipmentModal');
const addBtn = document.getElementById('addBtn');
const cancelBtn = document.getElementById('cancelBtn');
const equipmentForm = document.getElementById('equipmentForm');
const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const modalTitle = document.getElementById('modalTitle');

// State
let currentEditId = null;
let allEquipment = [];

// Modal Functions
function openModal(editId = null) {
    currentEditId = editId;
    
    if (editId) {
        modalTitle.textContent = 'Edit Equipment';
        const equipment = allEquipment.find(e => e.id === editId);
        if (equipment) {
            document.getElementById('equipmentName').value = equipment.name;
            document.getElementById('equipmentType').value = equipment.type;
            document.getElementById('equipmentCondition').value = equipment.condition;
            document.getElementById('equipmentQuantity').value = equipment.quantity;
        }
    } else {
        modalTitle.textContent = 'Add Equipment';
        equipmentForm.reset();
    }
    
    modal.classList.add('active');
}

function closeModal() {
    modal.classList.remove('active');
    equipmentForm.reset();
    currentEditId = null;
}

// Load Equipment from Firestore (real-time)
function loadEquipment() {
    onSnapshot(collection(db, 'equipment'), (querySnapshot) => {
        allEquipment = [];
        querySnapshot.forEach((doc) => {
            allEquipment.push({
                id: doc.id,
                ...doc.data()
            });
        });
        renderTable(allEquipment);
    }, (error) => {
        console.error('Error loading equipment:', error);
        tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Error loading equipment</td></tr>';
    });
}

// Add/Update Equipment
async function saveEquipment(e) {
    e.preventDefault();
    
    const name = document.getElementById('equipmentName').value.trim();
    const type = document.getElementById('equipmentType').value.trim();
    const condition = document.getElementById('equipmentCondition').value;
    const quantity = parseInt(document.getElementById('equipmentQuantity').value);
    
    if (!name || !type || !condition || !quantity) {
        alert('Please fill in all fields');
        return;
    }
    
    try {
        if (currentEditId) {
            // Update existing equipment
            await updateDoc(doc(db, 'equipment', currentEditId), {
                name,
                type,
                condition,
                quantity
            });
        } else {
            // Add new equipment
            await addDoc(collection(db, 'equipment'), {
                name,
                type,
                condition,
                quantity,
                createdAt: new Date()
            });
        }
        
        closeModal();
    } catch (error) {
        console.error('Error saving equipment:', error);
        alert('Error saving equipment');
    }
}

// Delete Equipment
async function deleteEquipment(id) {
    if (!confirm('Are you sure you want to delete this equipment?')) {
        return;
    }
    
    try {
        await deleteDoc(doc(db, 'equipment', id));
    } catch (error) {
        console.error('Error deleting equipment:', error);
        alert('Error deleting equipment');
    }
}

// Render Table
function renderTable(equipmentList) {
    if (!equipmentList || equipmentList.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">No equipment found</td></tr>';
        return;
    }
    
    tableBody.innerHTML = equipmentList.map(equipment => `
        <tr>
            <td style="font-weight:600;">${equipment.name}</td>
            <td>${equipment.type}</td>
            <td><span class="badge ${equipment.condition.toLowerCase()}">${equipment.condition}</span></td>
            <td>${equipment.quantity}</td>
            <td>
                <button class="action-btn edit" onclick="window.editEquipment('${equipment.id}')">Edit</button>
                <button class="action-btn delete" onclick="window.deleteEquipment('${equipment.id}')">Delete</button>
            </td>
        </tr>
    `).join('');
}

// Search/Filter
function filterEquipment() {
    const searchTerm = searchInput.value.toLowerCase();
    const filtered = allEquipment.filter(equipment =>
        equipment.name.toLowerCase().includes(searchTerm) ||
        equipment.type.toLowerCase().includes(searchTerm)
    );
    renderTable(filtered);
}

// Event Listeners
addBtn.addEventListener('click', () => openModal());
cancelBtn.addEventListener('click', closeModal);
equipmentForm.addEventListener('submit', saveEquipment);
searchInput.addEventListener('input', filterEquipment);

// Close modal on outside click
modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        closeModal();
    }
});

// Global functions for inline handlers
window.editEquipment = (id) => openModal(id);
window.deleteEquipment = (id) => deleteEquipment(id);

// Load equipment on page load
loadEquipment();
</script>

</body>
</html>
