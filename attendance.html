<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance UI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0b;
    --card: #151515;
    --border: #2a2a2a;
    --text: #ffffff;
    --muted: #9ca3af;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
}
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 30px; }
.title { font-size: 22px; font-weight: 700; }
.subtitle { font-size: 14px; color: var(--muted); margin-top: 5px; }
.filters { display: flex; align-items: center; gap: 14px; margin-top: 25px; flex-wrap: wrap; }
.filters label { font-size: 14px; color: var(--muted); }
.input, select { background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-family: 'Inter', sans-serif; font-size: 14px; }
.input:focus { border-color: var(--accent); }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
.search { width: 200px; }
.card { margin-top: 25px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.card-header { padding: 18px 20px; font-weight: 600; border-bottom: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 14px 20px; font-size: 12px; color: var(--muted); background: #111; text-transform: uppercase; }
td { padding: 20px; border-top: 1px solid var(--border); text-align: center; }
.loading { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
.loader { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.badge-present { background: rgba(34,197,94,0.15); color: #22c55e; }
.badge-absent  { background: rgba(239,68,68,0.15);  color: #ef4444; }
.badge-paid    { background: rgba(34,197,94,0.15);  color: #22c55e; }
.badge-unpaid  { background: rgba(239,68,68,0.15);  color: #ef4444; }
.action-btn { border: none; padding: 7px 13px; border-radius: 7px; font-size: 12px; cursor: pointer; color: white; margin: 0 3px; transition: opacity 0.2s; }
.action-btn:hover { opacity: 0.8; }
.action-btn.present { background: var(--green); }
.action-btn.absent  { background: var(--red); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div style="margin-bottom:14px;">
    <button onclick="window.location.href='gym_owner_panel.html'" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#1e1e1e;color:#a0a0a0;border:1px solid #2a2a2a;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;" onmouseover="this.style.borderColor='#666'" onmouseout="this.style.borderColor='#2a2a2a'">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Dashboard
    </button>
</div>

<div class="title">Attendance Management</div>
<div class="subtitle">View and edit member attendance</div>

<div class="filters">
    <label>Date:</label>
    <input type="date" class="input" id="dateInput">
    <label>Status:</label>
    <select id="statusFilter">
        <option value="All">All</option>
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>
    <input type="text" class="input search" id="searchInput" placeholder="Search name / ID…">
</div>

<div class="card">
    <div class="card-header" id="cardHeader">Attendance</div>
    <table>
        <thead>
            <tr>
                <th>POWER ID</th>
                <th>NAME</th>
                <th>PACKAGE</th>
                <th>FEE STATUS</th>
                <th>ATTENDANCE</th>
                <th>TIME</th>
                <th>ACTIONS</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="7" class="loading"><span class="loader"></span> Loading...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    updateDoc,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBawDWPi-NvWl3bKyGVIFi-v9FX7yHraEI",
    authDomain: "gimbo-dc910.firebaseapp.com",
    projectId: "gimbo-dc910",
    storageBucket: "gimbo-dc910.firebasestorage.app",
    messagingSenderId: "294864961933",
    appId: "1:294864961933:web:61d6c4086c09a506bf3dc4"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Helpers ───────────────────────────────────────────────────

function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDisplayDate(s) {
    const [y, m, d] = s.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function currentTime() {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function padId(id) {
    return String(id).trim().padStart(3, '0');
}

// ── Parse any Firestore date value → JS Date ──────────────────
function parseDate(val) {
    if (!val) return null;
    if (typeof val.toDate === 'function') return val.toDate();   // Firestore Timestamp
    if (val instanceof Date)              return val;
    if (typeof val === 'number')          return new Date(val);
    if (typeof val === 'string') {
        const s = val.trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s);
        const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (dmy) return new Date(`${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`);
        return new Date(s);
    }
    return null;
}

// ── Parse package string → duration in months ─────────────────
function packageToMonths(pkg) {
    if (!pkg) return 1;
    const s = pkg.toLowerCase().trim();
    if (s.includes('year'))    { const n = parseFloat(s) || 1; return Math.round(n * 12); }
    if (s.includes('half'))    return 6;
    if (s.includes('quarter')) return 3;
    if (s.includes('annual'))  return 12;
    const monthMatch = s.match(/(\d+\.?\d*)\s*month/);
    if (monthMatch) return parseFloat(monthMatch[1]);
    const num = parseFloat(s);
    if (!isNaN(num) && num > 0) return num;
    return 1;
}

// ── Add N months to a Date ────────────────────────────────────
function addMonths(date, months) {
    const d = new Date(date);
    d.setMonth(d.getMonth() + Math.floor(months));
    const extra = Math.round((months - Math.floor(months)) * 30);
    if (extra > 0) d.setDate(d.getDate() + extra);
    return d;
}

function resolveTime(data) {
    if (data.time && typeof data.time === 'string' && data.time !== '-' && data.time.trim() !== '') {
        return data.time.trim();
    }
    if (data.timestamp) {
        let date = null;
        if (typeof data.timestamp.toDate === 'function') date = data.timestamp.toDate();
        else if (data.timestamp instanceof Date)         date = data.timestamp;
        else if (typeof data.timestamp === 'number')     date = new Date(data.timestamp);
        if (date) return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    }
    return '-';
}

// ── State ─────────────────────────────────────────────────────
let allMembers      = [];  // { docId, powerId, name, package, lastPayment, fee }
let attendanceMap   = {};  // padded powerId → { docId, status, time }
let feesMap         = {};  // padded powerId → 'paid' | 'overdue' | 'pending'
let selectedDate    = todayStr();
let unsubAttendance = null;
let unsubMembers    = null;
let unsubFees       = null;

const tableBody    = document.getElementById('tableBody');
const cardHeader   = document.getElementById('cardHeader');
const dateInput    = document.getElementById('dateInput');
const statusFilter = document.getElementById('statusFilter');
const searchInput  = document.getElementById('searchInput');

// Set date input to today
dateInput.value = selectedDate;
cardHeader.textContent = `Attendance - ${formatDisplayDate(selectedDate)}`;

// ── Render ────────────────────────────────────────────────────
function renderTable() {
    const search = searchInput.value.trim().toLowerCase();
    const filter = statusFilter.value;

    const filtered = allMembers.filter(m => {
        const key     = padId(m.powerId);
        const att     = attendanceMap[key];
        const attStat = att ? att.status : 'absent';
        if (filter === 'Present' && attStat !== 'present') return false;
        if (filter === 'Absent'  && attStat !== 'absent')  return false;
        if (search && !m.name.toLowerCase().includes(search) && !key.includes(search)) return false;
        return true;
    });

    if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="loading">No records found.</td></tr>`;
        return;
    }

    tableBody.innerHTML = filtered.map(m => {
        const key    = padId(m.powerId);
        const att    = attendanceMap[key];
        const status = att ? att.status : 'absent';
        const time   = att ? att.time   : '-';

        const attBadge = status === 'present'
            ? `<span class="badge badge-present">Present</span>`
            : `<span class="badge badge-absent">Absent</span>`;

        // ── FIX: fee status uses member data as fallback ──────
        const feeState = feesMap[key] || 'pending';
        const feeBadge = feeState === 'paid'
            ? `<span class="badge badge-paid">Paid</span>`
            : feeState === 'overdue'
            ? `<span class="badge" style="background:rgba(245,158,11,0.15);color:#f59e0b;">Overdue</span>`
            : `<span class="badge badge-unpaid">Unpaid</span>`;

        return `
        <tr data-powerid="${key}">
            <td>${key}</td>
            <td style="text-align:left">${m.name}</td>
            <td>${m.package}</td>
            <td>${feeBadge}</td>
            <td>${attBadge}</td>
            <td>${time}</td>
            <td>
                <button class="action-btn present" onclick="window._markOne('${key}','present')">✓ Present</button>
                <button class="action-btn absent"  onclick="window._markOne('${key}','absent')">✗ Absent</button>
            </td>
        </tr>`;
    }).join('');
}

// ── Rebuild feesMap from members + fees data ──────────────────
// Called whenever either members or fees snapshots update
let _membersRaw = {};  // powerId → member doc data
let _feesRaw    = {};  // powerId → most recent fees doc data

function rebuildFeesMap() {
    feesMap = {};
    const now = new Date();

    for (const [pid, m] of Object.entries(_membersRaw)) {
        const key = padId(pid);
        const f   = _feesRaw[pid] || null;

        // ── Resolve last payment date ──────────────────────────
        // Priority: fees.paymentDate → member.lastPayment → member.joinDate → member.joinedDate
        let lastPaymentDate = null;
        if (f && f.paymentDate)  lastPaymentDate = parseDate(f.paymentDate);
        if (!lastPaymentDate && m.lastPayment)  lastPaymentDate = parseDate(m.lastPayment);
        if (!lastPaymentDate && m.joinDate)     lastPaymentDate = parseDate(m.joinDate);
        if (!lastPaymentDate && m.joinedDate)   lastPaymentDate = parseDate(m.joinedDate);

        if (!lastPaymentDate) {
            feesMap[key] = 'pending';
            continue;
        }

        // ── Resolve package & next payment ────────────────────
        const pkg          = m.package || (f && f.package) || '1 Month';
        const durationMos  = packageToMonths(pkg);
        const nextPayment  = addMonths(lastPaymentDate, durationMos);

        // ── Determine fee state ───────────────────────────────
        if (f && (f.status || '').toLowerCase() === 'paid') {
            feesMap[key] = nextPayment < now ? 'overdue' : 'paid';
        } else if (!f) {
            // No fees doc — derive from member dates
            feesMap[key] = nextPayment < now ? 'overdue' : 'paid';
        } else {
            feesMap[key] = 'pending';
        }
    }

    renderTable();
}

// ── Listeners ─────────────────────────────────────────────────

function startAttendanceListener(date) {
    if (unsubAttendance) { unsubAttendance(); unsubAttendance = null; }
    attendanceMap = {};

    const q = query(collection(db, 'attendance'), where('date', '==', date));

    unsubAttendance = onSnapshot(q, snapshot => {
        attendanceMap = {};
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const key  = padId(data.powerId);
            const resolvedTime = resolveTime(data);
            const existing = attendanceMap[key];
            // Always keep the record — prefer present over absent, and prefer one with a time
            if (!existing ||
                (data.status === 'present' && existing.status !== 'present') ||
                (resolvedTime !== '-' && existing.time === '-')) {
                attendanceMap[key] = {
                    docId  : docSnap.id,
                    status : data.status || 'absent',
                    time   : resolvedTime
                };
            }
        });
        renderTable();
    }, err => console.error('Attendance error:', err));
}

function startMembersListener() {
    if (unsubMembers) { unsubMembers(); unsubMembers = null; }

    unsubMembers = onSnapshot(collection(db, 'members'), snapshot => {
        allMembers  = [];
        _membersRaw = {};

        snapshot.forEach(docSnap => {
            const m = docSnap.data();
            if ((m.status || '').toLowerCase() === 'left') return;
            const pid = String(m.powerId || '');
            allMembers.push({
                docId   : docSnap.id,
                powerId : pid,
                name    : m.name    || '—',
                package : m.package || '-'
            });
            _membersRaw[pid] = m;   // store full doc for fee calculation
        });

        allMembers.sort((a, b) => parseInt(a.powerId) - parseInt(b.powerId));
        rebuildFeesMap();   // recalc fee status with latest member data
    }, err => console.error('Members error:', err));
}

function startFeesListener() {
    if (unsubFees) { unsubFees(); unsubFees = null; }

    unsubFees = onSnapshot(collection(db, 'fees'), snapshot => {
        _feesRaw = {};

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const pid  = String(data.powerId || '').trim();
            if (!pid) return;

            // Keep the most recent fees doc per member
            const existing     = _feesRaw[pid];
            const existingDate = existing ? parseDate(existing.paymentDate) : null;
            const thisDate     = parseDate(data.paymentDate);

            if (!existing || (thisDate && existingDate && thisDate > existingDate)) {
                _feesRaw[pid] = data;
            }
        });

        rebuildFeesMap();   // recalc fee status with latest fees data
    }, err => console.error('Fees error:', err));
}

// ── Save / Update attendance in Firebase ─────────────────────
async function saveAttendance(member, status) {
    const key      = padId(member.powerId);
    const time     = status === 'present' ? currentTime() : '-';
    const existing = attendanceMap[key];

    if (existing && existing.docId) {
        // ── FIX: always updateDoc if record exists (re-marking works) ──
        await updateDoc(doc(db, 'attendance', existing.docId), {
            powerId   : key,
            status,
            time,
            timestamp : new Date()
        });
    } else {
        await addDoc(collection(db, 'attendance'), {
            memberId  : member.docId,
            powerId   : key,
            name      : member.name,
            date      : selectedDate,
            status,
            time,
            timestamp : new Date()
        });
    }
}

window._markOne = async (powerId, status) => {
    const key    = padId(powerId);
    const member = allMembers.find(m => padId(m.powerId) === key);
    if (!member) return;

    const row  = tableBody.querySelector(`tr[data-powerid="${key}"]`);
    const btns = row ? row.querySelectorAll('.action-btn') : [];
    btns.forEach(b => b.disabled = true);

    try {
        await saveAttendance(member, status);
        // Buttons re-enable automatically via onSnapshot re-render
    } catch(e) {
        console.error('Mark attendance error:', e);
        btns.forEach(b => b.disabled = false);
    }
};

// ── Date input change ─────────────────────────────────────────
dateInput.addEventListener('change', () => {
    const val = dateInput.value;  // always "YYYY-MM-DD" from type=date
    if (!val) return;
    selectedDate = val;
    cardHeader.textContent = `Attendance - ${formatDisplayDate(selectedDate)}`;
    tableBody.innerHTML = `<tr><td colspan="7" class="loading"><span class="loader"></span> Loading…</td></tr>`;
    startAttendanceListener(selectedDate);
});

searchInput.addEventListener('input',   renderTable);
statusFilter.addEventListener('change', renderTable);

// ── Boot ──────────────────────────────────────────────────────
startMembersListener();
startAttendanceListener(selectedDate);
startFeesListener();
</script>
</body>
</html>
